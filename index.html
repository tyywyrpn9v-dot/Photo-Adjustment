<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>相簿配方</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --bg:#f3f0ea; --surface:#faf8f4; --ink:#1c1b19; --muted:#6f6a62; --faint:#8d877e; --line:#e3ddd3; --chip:#ece7df; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang HK",sans-serif; line-height:1.5; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .wrap { width:min(64rem, calc(100% - 2.5rem)); margin:0 auto; padding:2rem 0 4rem; }
    .kicker { margin:0; font-size:.875rem; font-weight:500; letter-spacing:.04em; color:var(--muted); }
    h1, h2, h3 { font-family:"Noto Serif TC",serif; font-weight:500; text-wrap:balance; }
    h1 { margin:.5rem 0 0; font-size:clamp(2.2rem, 6vw, 3rem); letter-spacing:-.02em; }
    .lead { max-width:36rem; margin:1rem 0 0; font-size:1rem; }
    .filters { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1.5rem; }
    .filters button, .ghost { min-height:2.75rem; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:0 1rem; }
    .filters button[aria-checked="true"] { background:var(--ink); color:#f7f4ef; border-color:var(--ink); }
    .grid { display:grid; gap:1rem; margin-top:1.5rem; }
    @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr; } }
    .card { position:relative; overflow:hidden; border:1px solid var(--line); background:var(--surface); border-radius:28px; }
    .card a { display:block; text-decoration:none; }
    .card img { display:block; width:100%; max-width:100%; aspect-ratio:3/2; object-fit:cover; background:var(--chip); }
    .detail img { display:block; width:100%; max-width:100%; height:auto; background:var(--chip); }
    table.fit { width:100%; min-width:0; border-collapse:collapse; font-size:.875rem; }
    table.fit th, table.fit td { text-align:left; padding:.6rem .75rem; border-bottom:1px solid var(--line); vertical-align:top; }
    table.fit td.num, table.fit th.num { width:42%; text-align:right; font-family:"IBM Plex Mono",monospace; }
    .card .pad, .detail .pad { padding:1.25rem; }
    .heart { position:absolute; top:.75rem; right:.75rem; width:2.75rem; height:2.75rem; border-radius:999px; border:1px solid var(--line); background:var(--surface); }
    .heart[aria-pressed="true"] { background:var(--ink); color:#f7f4ef; }
    h3 { margin:0; font-size:1.8rem; }
    .line { margin:.5rem 0 0; font-size:.875rem; }
    .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:1rem; }
    .keys div { background:var(--chip); border-radius:8px; padding:.5rem; }
    .keys dt { font-size:.75rem; color:var(--muted); }
    .keys dd { margin:0; font-family:"IBM Plex Mono",monospace; font-size:.875rem; }
    .empty { border:1px solid var(--line); background:var(--surface); border-radius:28px; padding:2rem 1.25rem; color:var(--muted); }
    h2 { margin:3rem 0 0; font-size:1.5rem; }
    .want { margin-top:1rem; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .want a { display:flex; min-height:3.5rem; align-items:center; justify-content:space-between; gap:1rem; padding:.75rem 0; text-decoration:none; border-top:1px solid var(--line); }
    .want a:first-child { border-top:0; }
    .want span:last-child { font-family:"Noto Serif TC",serif; font-size:1.15rem; }
    table { width:100%; min-width:40rem; border-collapse:collapse; font-size:.875rem; }
    th, td { text-align:left; padding:.75rem; border-bottom:1px solid var(--line); }
    td, .mono { font-family:"IBM Plex Mono",monospace; }
    .scroll { overflow-x:auto; margin-top:1rem; border:1px solid var(--line); border-radius:28px; background:var(--surface); }
    .note { margin-top:.75rem; color:var(--faint); font-size:.75rem; }
    .back { display:inline-flex; min-height:2.75rem; align-items:center; color:var(--muted); text-decoration:none; }
    .detail { margin-top:1rem; overflow:hidden; border:1px solid var(--line); border-radius:28px; background:var(--surface); }
    .title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:.75rem; }
    .title-row h1 { font-size:2.4rem; }
    .row { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1.5rem; align-items:center; }
    .banner { margin-top:1rem; border:1px solid var(--line); background:var(--chip); border-radius:12px; padding:.75rem; font-size:.875rem; }
    .group { margin-top:2rem; }
    .group ul { list-style:none; margin:.75rem 0 0; padding:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .group li { padding:.75rem 0; border-top:1px solid var(--line); }
    .group li:first-child { border-top:0; }
    .step { display:flex; justify-content:space-between; gap:1rem; align-items:baseline; }
    .hint, .why { margin:.15rem 0 0; color:var(--faint); font-size:.75rem; }
    .why { color:var(--muted); }
    .tag { margin-left:.5rem; color:var(--faint); font-size:.75rem; }
    .dock { position:fixed; left:0; right:0; bottom:0; border-top:1px solid var(--line); background:var(--surface); }
    .dock .wrap { display:flex; padding:.75rem 0 calc(.75rem + env(safe-area-inset-bottom)); }
    .dock button { flex:1; min-height:3rem; border:0; border-radius:12px; background:var(--ink); color:#f7f4ef; }
    body.recipe { padding-bottom:5.5rem; }
    .muted { color:var(--muted); }
  </style>
</head>

:"🌡️","value":"-2","neutral":"0","why":"","key":false,"optional":false,"always":false},{"group":"adjust","label":"色調（Tint）","hint":"不是 Tone","emoji":"🟣","value":"-8","neutral":"0","why":"偏綠。","key":true,"optional":false,"always":false},{"group":"adjust","label":"銳利度（Sharpness）","hint":"","emoji":"🔪","value":"+10","neutral":"0","why":"","key":false,"optional":false,"always":false},{"group":"adjust","label":"清晰度（Definition）","hint":"","emoji":"🔍","value":"0","neutral":"0","why":"","key":false,"optional":false,"always":false},{"group":"adjust","label":"雜訊消除（Noise Reduction）","hint":"","emoji":"🌫️","value":"0","neutral":"0","why":"","key":false,"optional":false,"always":false},{"group":"adjust","label":"暈影（Vignette）","hint":"","emoji":"🔲","value":"0","neutral":"0","why":"","key":false,"optional":false,"always":false},{"group":"filter","label":"濾鏡（Filter）","hint":"","emoji":"🎛️","value":"原片（Original）","neutral":"原片（Original）","why":"開了風格就沒有濾鏡頁。保持原片。","key":false,"optional":false,"always":true},{"group":"portrait","label":"人像（Portrait）","hint":"","emoji":"👤","value":"關（Off）","neutral":"關（Off）","why":"人加風景就關。","key":false,"optional":false,"always":true}],"compare":["-10","-5","-10","+5","-2","-8","關（Off）"]}]}</script>
  <script>
    const DATA = JSON.parse(document.getElementById("payload").textContent);
    const SAVED_KEY = "xiangbu-saved";
    const app = document.getElementById("app");
    let filter = "all";
    let showAll = false;
    let copied = false;

    function saved() {
      try {
        const parsed = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");
        return Array.isArray(parsed) ? parsed.filter((item) => typeof item === "string") : [];
      } catch { return []; }
    }
    function toggleSaved(slug) {
      const next = saved().includes(slug) ? saved().filter((item) => item !== slug) : saved().concat(slug);
      localStorage.setItem(SAVED_KEY, JSON.stringify(next));
      draw();
    }
    function visible(recipe) {
      if (filter === "all") return true;
      if (filter === "saved") return saved().includes(recipe.slug);
      return recipe.tags.includes(filter);
    }
    function stepsOf(recipe) {
      return recipe.steps.filter((step) => showAll || step.always || step.value !== step.neutral);
    }
    function clipboard(recipe) {
      const lines = [recipe.name, recipe.line, "由原片開始，先還原已有編輯。", "這段文字不能貼進「相片」。請開編輯，跟住清單拉。", "如果已經在相片 app 拷貝了調整項目，不要再複製這段，否則會清掉。", ""];
      let group = "";
      for (const step of stepsOf(recipe)) {
        if (step.group !== group) {
          group = step.group;
          const label = DATA.groups.find((item) => item.id === group).label;
          lines.push("【" + label + "】");
          if (group === "style") lines.push("色調同顏色在調色盤上一起拖，不是「調整」裡的滑桿。");
        }
        lines.push(step.label + (step.hint ? "（" + step.hint + "）" : "") + "：" + step.value);
      }
      lines.push("", "未列出的調整保持 0。", "調好一張後，先在相片 app 按「拷貝調整項目」，再貼到其他相。", recipe.avoid);
      return lines.join("\n");
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function heart(slug) {
      const button = el("button", "heart");
      button.type = "button";
      button.setAttribute("aria-pressed", saved().includes(slug) ? "true" : "false");
      button.setAttribute("aria-label", saved().includes(slug) ? "取消收藏" : "收藏");
      button.textContent = "♥";
      button.addEventListener("click", (event) => { event.preventDefault(); event.stopPropagation(); toggleSaved(slug); });
      return button;
    }
    function filters() {
      const row = el("div", "filters");
      row.setAttribute("role", "radiogroup");
      row.setAttribute("aria-label", "風格");
      for (const item of DATA.filters) {
        const button = el("button", "", item.label);
        button.type = "button";
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", item.id === filter ? "true" : "false");
        button.addEventListener("click", () => { filter = item.id; draw(); });
        row.append(button);
      }
      return row;
    }
    function home() {
      document.body.classList.remove("recipe");
      const recipes = DATA.recipes.filter(visible);
      const wrap = el("main", "wrap");
      wrap.append(el("p", "kicker", "iPhone 相片 · 手動調色"));
      wrap.append(el("h1", "", "相簿配方"));
      wrap.append(el("p", "lead", "選擇最適合的日系調色風格。"));
      wrap.append(filters());
      if (!recipes.length) {
        wrap.append(el("p", "empty", filter === "saved" ? "還沒有收藏。按心形就可以留下。" : "這個分類還沒有風格。"));
      } else {
        const grid = el("div", "grid");
        for (const recipe of recipes) {
          const card = el("article", "card");
          card.append(heart(recipe.slug));
          const link = el("a");
          link.href = "#/" + recipe.slug;
          const img = el("img");
          img.src = recipe.image;
          img.alt = recipe.name + "的模擬相片";
          link.append(img);
          const pad = el("div", "pad");
          pad.append(el("h3", "", recipe.name));
          pad.append(el("p", "line", recipe.line));
          const keys = el("dl", "keys");
          for (const step of recipe.steps.filter((item) => item.key && item.group === "adjust").slice(0, 3)) {
            const cell = el("div");
            cell.append(el("dt", "", step.label));
            cell.append(el("dd", "", step.value));
            keys.append(cell);
          }
          pad.append(keys);
          link.append(pad);
          card.append(link);
          grid.append(card);
        }
        wrap.append(grid);
        wrap.append(el("h2", "", "如果我想要"));
        const list = el("div", "want");
        for (const recipe of recipes) {
          const link = el("a");
          link.href = "#/" + recipe.slug;
          link.append(el("span", "", recipe.want), el("span", "", recipe.name));
          list.append(link);
        }
        wrap.append(list);
        wrap.append(el("h2", "", "關鍵滑桿"));
        wrap.append(el("p", "muted", "顆粒在質感裡，不在調整滑桿。"));
        const scroll = el("div", "scroll");
        const table = el("table");
        const head = document.createElement("tr");
        for (const label of ["配方", "曝光 Exposure", "對比 Contrast", "黑點 Black Point", "飽和 Saturation", "暖色 Warmth", "色調 Tint", "顆粒 Grain"]) head.append(el("th", "", label));
        table.append(head);
        for (const recipe of recipes) {
          const row = document.createElement("tr");
          row.append(el("th", "", recipe.name));
          for (const value of recipe.compare) row.append(el("td", "", value));
          table.append(row);
        }
        scroll.append(table);
        wrap.append(scroll);
        wrap.append(el("p", "note", "攝影風格的「色調」是調色盤上下。調整裡的「色調」是綠同洋紅。兩套數字不要對調。質感、顆粒只限 iPhone 18 Pro 高效率原片。"));
      }
      app.replaceChildren(wrap);
    }
    function recipePage(recipe) {
      document.body.classList.add("recipe");
      const wrap = el("main", "wrap");
      const back = el("a", "back", "全部方向");
      back.href = "#/";
      wrap.append(back);
      const detail = el("article", "detail");
      const img = el("img");
      img.src = recipe.image;
      img.alt = recipe.name + "的模擬相片";
      detail.append(img);
      const pad = el("div", "pad");
      const title = el("div", "title-row");
      title.append(el("h1", "", recipe.name), heart(recipe.slug));
      pad.append(title, el("p", "", recipe.line), el("p", "muted", "適合：" + recipe.fit), el("p", "muted", recipe.avoid));
      detail.append(pad);
      wrap.append(detail);
      const row = el("div", "row");
      const toggle = el("button", "ghost", showAll ? "只顯示要改" : "顯示全部");
      toggle.type = "button";
      toggle.addEventListener("click", () => { showAll = !showAll; draw(); });
      row.append(toggle);
      wrap.append(row);
      wrap.append(el("p", "banner", "相片 → 編輯。先還原。質感、顆粒只有 18 Pro 原片先有。"));
      let last = "";
      for (const step of stepsOf(recipe)) {
        if (step.group !== last) {
          last = step.group;
          const section = el("section", "group");
          section.append(el("h2", "", DATA.groups.find((item) => item.id === step.group).label));
          if (step.group === "style") section.append(el("p", "note", "Tone、Color 在調色盤。不要填進 Warmth 或 Tint。"));
          const table = el("table", "fit");
          const head = document.createElement("tr");
          head.append(el("th", "", "參數"), el("th", "num", "調整"));
          table.append(head);
          section.append(table);
          wrap.append(section);
        }
        const tr = document.createElement("tr");
        const name = el("td");
        const changed = step.value !== step.neutral;
        const label = el("p", "", (changed && step.emoji ? step.emoji + " " : "") + step.label);
        name.append(label);
        if (step.why) name.append(el("p", "why", step.why));
        const num = el("td", "num");
        const cut = step.value.indexOf("（");
        if (cut > 0 && step.value.endsWith("）")) {
          num.append(el("span", "", step.value.slice(0, cut)));
          num.append(el("span", "why", step.value.slice(cut + 1, -1)));
          num.querySelector("span.why").style.display = "block";
        } else {
          num.textContent = step.value;
        }
        tr.append(name, num);
        wrap.querySelector("section.group:last-child table").append(tr);
      }
      const dock = el("div", "dock");
      const bar = el("div", "wrap");
      const copy = el("button", "", copied ? "已複製步驟" : "複製步驟");
      copy.type = "button";
      copy.addEventListener("click", async () => {
        const text = clipboard(recipe);
        try { await navigator.clipboard.writeText(text); }
        catch {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.append(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        copied = true;
        draw();
        setTimeout(() => { copied = false; draw(); }, 1600);
      });
      bar.append(copy);
      dock.append(bar);
      app.replaceChildren(wrap, dock);
    }
    function draw() {
      const slug = location.hash.replace(/^#\/?/, "");
      const recipe = DATA.recipes.find((item) => item.slug === slug);
      if (recipe) recipePage(recipe);
      else home();
    }
    window.addEventListener("hashchange", draw);
    draw();
  </script>
